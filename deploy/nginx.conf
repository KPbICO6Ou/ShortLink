server {
    listen 80;
    listen [::]:80;
    server_name ymi.link;
    # Let certbot or acme.sh fill in the 443 block.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ymi.link;

    # ssl_certificate     /etc/letsencrypt/live/ymi.link/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ymi.link/privkey.pem;

    # Block the admin API from the public web; expose only the redirect
    # surface and the QR endpoint.
    location ~ ^/(api|docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
